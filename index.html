<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>NaNocks - Sign Up</title>
    <style>
        body {
            background-color: #0f71d3;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; 
            text-align: center;
            color: white;
            background-image: url('https://img.magnific.com/free-vector/stunning-cityscapes-banner-with-cute-cloud-design_1017-50618.jpg?semt=ais_hybrid&w=740&q=80'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            height: 100vh; 
            margin: 0;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><text y="20" font-size="20">☚</text></svg>'), auto !important;
        }
        .container {
            width: 300px;
            background: white;
            color: black;
            padding: 20px;
            margin: 100px auto;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 200px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 0; 
            font-size: 14px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><text y="20" font-size="20">💬</text></svg>'), auto !important;
        }
        button {
            background-color: #0055cc;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            padding: 10px; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><text y="20" font-size="20">☚</text></svg>'), auto !important;
        }
        .login-btn {
            background-color: #0055cc;
        }
        .signup-btn {
            background-color: #444;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><text y="20" font-size="20">☚</text></svg>'), auto !important;
        }
        button:hover {
            opacity: 0.8;
        }
        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0;
        }
        .switch {
            width: 35px;
            height: 18px;
            background: #ccc;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }
        .switch::before {
            content: '';
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 2px;
            transition: 0.3s;
        }
        .switch.checked::before {
            left: 17px;
        }
        .version {
            position: absolute;
            bottom: 10px; 
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer; 
        }
        a {
            background-color: #0055cc;
            color: white;
            border: none;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
            padding: 10px;
            width: 8px;
         }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/boblox-classic (1).png" alt="NaNocks" class="logo">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Username" required>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password" required>
        <div class="toggle-switch">
            <span>Login? Toggle</span>
            <div class="switch" onclick="toggleSwitch()"></div>
        </div>
        <button class="login-btn" onclick="loginClick()">Sign Up</button>
        <a button class="signup-btn" data-theme="f" href="1homepage.html">Become Visitor!</a>
    </div>

    <div class="version" onclick="cycleVersion()">
        Version 1.1.1
    </div>

    <script>
        let currentVersion = [1, 1, 1];

        

            document.querySelector('.version').innerText = `Version ${currentVersion.join('.')}`;
        }

        function toggleSwitch() {
            const switchElement = document.querySelector('.switch');
            switchElement.classList.toggle('checked');
        }

        function loginClick() {
            alert('Please sign up as a visitor first!');
        }
    </script>
</body>
</html>
